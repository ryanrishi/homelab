---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-single
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "1"
  staleReplicaTimeout: "30"
  fromBackup: ""
  fsType: "ext4"
  # A failed local-replica placement leaves a placeholder replica pinned to the pod's
  # node instead of being discarded. On a single-replica volume that placeholder holds
  # the only slot, so draining the node it sits on can never complete.
  dataLocality: "disabled"
