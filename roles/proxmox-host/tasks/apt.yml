- name: Locate deb822 enterprise apt repositories
  ansible.builtin.stat:
    path: "/etc/apt/sources.list.d/{{ item }}.sources"
  loop: "{{ proxmox_enterprise_deb822_sources }}"
  register: _enterprise_sources

# Disabled rather than deleted: these are dpkg conffiles owned by pve-manager, so an
# `Enabled: false` edit is preserved across upgrades, and it matches what the Proxmox UI does.
- name: Disable deb822 enterprise apt repositories
  ansible.builtin.lineinfile:
    path: "{{ item.stat.path }}"
    regexp: '^Enabled:'
    line: "Enabled: false"
    state: present
  loop: "{{ _enterprise_sources.results | selectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.stat.path }}"

- name: Add apt repositories
  ansible.builtin.deb822_repository:
    name: "{{ item.name }}"
    types: deb
    uris: "{{ item.uris }}"
    suites: "{{ item.suites }}"
    components: "{{ item.components }}"
    signed_by: "{{ item.signed_by }}"
    state: present
  loop: "{{ proxmox_repositories }}"
  loop_control:
    label: "{{ item.name }}"

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Perform dist-upgrade
  ansible.builtin.apt:
    upgrade: dist
  notify: Report that a reboot is required

- name: Install packages
  ansible.builtin.apt:
    name: "{{ proxmox_packages }}"
    state: present
