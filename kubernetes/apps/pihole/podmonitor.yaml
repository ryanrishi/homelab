---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: pihole
  namespace: pihole
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pihole
  podMetricsEndpoints:
    - port: prometheus
      interval: 30s
      # The exporter labels each series with the pod IP, which changes on restart; `pod` identifies the instance
      metricRelabelings:
        - action: labeldrop
          regex: hostname
