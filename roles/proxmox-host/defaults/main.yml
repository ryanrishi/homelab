proxmox_nic: eno1

# A major-version upgrade reinstates the enterprise repos enabled, and without a subscription apt
# then fails 401. Basenames of the .sources files to keep disabled.
proxmox_enterprise_deb822_sources:
  - pve-enterprise
  - ceph

proxmox_repositories:
  - name: proxmox
    uris: http://download.proxmox.com/debian/pve/
    suites: trixie
    components: pve-no-subscription
    signed_by: /usr/share/keyrings/proxmox-archive-keyring.gpg

proxmox_packages:
  - ethtool

proxmox_vfio_modules:
  - vfio
  - vfio_iommu_type1
  - vfio_pci

proxmox_local_content:
  - backup
  - images
  - import
  - iso
  - snippets
  - vztmpl
