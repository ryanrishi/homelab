---
- name: Install Longhorn node prerequisites
  ansible.builtin.apt:
    name:
      - open-iscsi
    state: present
    update_cache: true

- name: Enable and start iscsid
  ansible.builtin.systemd:
    name: iscsid
    enabled: true
    state: started

- name: Check for Longhorn data disk
  ansible.builtin.stat:
    path: "{{ longhorn_data_disk }}"
  register: data_disk

- name: Configure Longhorn data disk
  when: data_disk.stat.exists
  vars:
    data_disk_device: "{{ data_disk.stat.lnk_source | default(longhorn_data_disk) }}"
    root_device: "{{ (ansible_mounts | selectattr('mount', 'equalto', '/') | first).device }}"
  block:
    # The by-id path is pinned to the controller slot Terraform attaches the data
    # disk to, so this only has to catch the disk being rewired underneath it.
    - name: Verify the data disk does not back the root filesystem
      ansible.builtin.assert:
        that:
          - not root_device.startswith(data_disk_device)
        fail_msg: >-
          Refusing to touch {{ longhorn_data_disk }}: it resolves to
          {{ data_disk_device }}, which backs the root filesystem ({{ root_device }})

    # Creates the filesystem when the disk is blank and grows it into the rest of
    # the device afterwards, so widening the disk needs no separate resize step.
    # Refuses to overwrite an existing filesystem of a different type.
    - name: Ensure data disk holds an ext4 filesystem spanning the whole device
      community.general.filesystem:
        dev: "{{ longhorn_data_disk }}"
        fstype: ext4
        opts: -L longhorn-data
        resizefs: true

    - name: Create /var/lib/longhorn mount point
      ansible.builtin.file:
        path: /var/lib/longhorn
        state: directory
        mode: "0755"

    - name: Mount data disk at /var/lib/longhorn
      ansible.posix.mount:
        path: /var/lib/longhorn
        src: LABEL=longhorn-data
        fstype: ext4
        opts: defaults
        state: mounted
