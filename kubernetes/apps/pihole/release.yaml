---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pihole
  namespace: pihole
spec:
  interval: 8h
  timeout: 15m
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: pihole
      version: 2.39.0
      sourceRef:
        kind: HelmRepository
        name: pihole
        namespace: pihole
  valuesFrom:
    - kind: ConfigMap
      name: pihole-config
  values:
    replicaCount: 3
    serviceDns:
      type: LoadBalancer
      annotations:
        metallb.io/loadBalancerIPs: ${SVC_PIHOLE_IP}
        metallb.io/allow-shared-ip: pihole-svc
    serviceWeb:
      type: LoadBalancer
      annotations:
        metallb.io/loadBalancerIPs: ${SVC_PIHOLE_IP}
        metallb.io/allow-shared-ip: pihole-svc
    adminPassword: ${SECRET_PIHOLE_ADMIN_PASSWORD}
    extraEnvVars:
      RATE_LIMIT: "0/0"
    podAnnotations:
      kubectl.kubernetes.io/default-container: pihole
    extraVolumes:
      logs:
        emptyDir: {}
    extraVolumeMounts:
      logs:
        mountPath: /var/log/pihole
    # Pi-hole writes queries to a file, not stdout, so stream it for Alloy
    extraContainers:
      - name: querylog
        image: busybox:1.37.0
        command: ["tail", "-n0", "-F", "/var/log/pihole/pihole.log"]
        volumeMounts:
          - name: logs
            mountPath: /var/log/pihole
            readOnly: true
        resources:
          requests:
            memory: 16Mi
            cpu: 5m
          limits:
            memory: 32Mi
    monitoring:
      sidecar:
        enabled: true
        image:
          tag: v1.3.1
        resources:
          requests:
            memory: 32Mi
            cpu: 5m
          limits:
            memory: 64Mi
    whitelist:
      - app.segment.com
      - api.segment.io
      - cdn.segment.com
      - api.amplitude.com
      - api2.amplitude.com
      - cdn.amplitude.com
      - static.amplitude.com
      - info.amplitude.com
      - regionconfig.amplitude.com
      - api.eu.amplitude.com
      - api.lab.amplitude.com
    priorityClassName: critical-dns
    # Alloy collects logs only on these nodes
    nodeSelector:
      lab.ryanrishi.com/longhorn-enabled: "true"
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - pihole
            topologyKey: kubernetes.io/hostname
    # One replica per k3s node is not enough — several nodes share a Proxmox host,
    # so spread across the zone label that maps to the physical machine. Soft, because
    # a host down for maintenance must not leave a replica permanently unschedulable.
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: pihole
