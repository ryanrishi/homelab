---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 8h
  timeout: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 65.1.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
  values:
    # Prometheus configuration
    prometheus:
      enabled: true
      prometheusSpec:
        nodeSelector:
          lab.ryanrishi.com/longhorn-enabled: "true"
        # Lower priority than critical services
        priorityClassName: monitoring-stack
        # Init container to wait for MetalLB
        initContainers:
          - name: wait-for-metallb
            image: busybox:1.35
            command: ['sh', '-c']
            args:
              - |
                echo "Waiting for MetalLB controller to be ready..."
                until nslookup metallb-webhook-service.metallb-system.svc.cluster.local; do
                  echo "MetalLB not ready, sleeping..."
                  sleep 10
                done
                echo "MetalLB is ready!"
        # Reduce scrape frequency for homelab
        evaluationInterval: 60s
        scrapeInterval: 60s
        resources:
          requests:
            memory: 1Gi
            cpu: 100m
          limits:
            memory: 2Gi
            cpu: 500m
        # retention is the policy; retentionSize is a safety valve and has to stay
        # well under the volume, which holds the WAL and compaction scratch too.
        retention: 7d
        retentionSize: 15GB
        # Reduce TSDB settings for lower CPU usage
        tsdb:
          outOfOrderTimeWindow: 0s
        # Disable remote write features
        remoteWrite: []
        # Storage configuration
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn-single
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 25Gi
        # Service configuration for external access
        service:
          type: LoadBalancer

    # Grafana configuration
    grafana:
      enabled: true
      nodeSelector:
        lab.ryanrishi.com/longhorn-enabled: "true"
      # Lower priority than critical services
      priorityClassName: monitoring-stack
      # Enable admin user with secret reference
      admin:
        existingSecret: grafana-admin-secret
        userKey: admin-user
        passwordKey: admin-password
      
      # Service configuration for external access
      service:
        type: LoadBalancer
        annotations:
          metallb.universe.tf/loadBalancerIPs: 192.168.4.234

      resources:
        requests:
          memory: 256Mi
          cpu: 50m
        limits:
          memory: 512Mi
          cpu: 500m
      
      # Persistence for dashboards
      persistence:
        enabled: true
        storageClassName: longhorn-single
        size: 2Gi
      
      # Default dashboards
      defaultDashboardsEnabled: true
      
      # Grafana configuration
      grafana.ini:
        server:
          root_url: http://grafana.homelab.local
        auth.anonymous:
          enabled: true
          org_role: Viewer
    
    # AlertManager configuration
    alertmanager:
      enabled: true
      config:
        global:
          resolve_timeout: 5m
        route:
          group_by: [alertname, namespace]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          receiver: pushover
          routes:
            - receiver: "null"
              matchers:
                - alertname = "Watchdog"
            - receiver: "null"
              matchers:
                - severity =~ "info|none"
        inhibit_rules:
          - source_matchers: [severity = critical]
            target_matchers: [severity =~ warning|info]
            equal: [namespace, alertname]
          - source_matchers: [severity = warning]
            target_matchers: [severity = info]
            equal: [namespace, alertname]
          - source_matchers: [alertname = InfoInhibitor]
            target_matchers: [severity = info]
            equal: [namespace]
          - target_matchers: [alertname = InfoInhibitor]
        receivers:
          - name: "null"
          - name: pushover
            pushover_configs:
              - user_key_file: /etc/alertmanager/secrets/alertmanager-pushover/user_key
                token_file: /etc/alertmanager/secrets/alertmanager-pushover/token
                send_resolved: true
                priority: '{{ if eq .CommonLabels.severity "critical" }}1{{ else }}0{{ end }}'
                title: '{{ .Status | toUpper }} {{ .CommonLabels.alertname }}'
                message: |-
                  {{ range .Alerts }}{{ .Annotations.summary }}
                  {{ .Annotations.description }}
                  {{ end }}
      alertmanagerSpec:
        nodeSelector:
          lab.ryanrishi.com/longhorn-enabled: "true"
        secrets:
          - alertmanager-pushover
        # Lower priority than critical services
        priorityClassName: monitoring-stack
        resources:
          requests:
            memory: 64Mi
            cpu: 25m
          limits:
            memory: 128Mi
            cpu: 50m
        # Storage configuration
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn-single
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 2Gi
        # Service configuration
        service:
          type: LoadBalancer
    
    # Node exporter configuration (optimized for homelab)
    nodeExporter:
      enabled: true
      # Reduce resource usage
      resources:
        requests:
          memory: 8Mi
          cpu: 5m
        limits:
          memory: 16Mi
          cpu: 25m
      
    # kube-state-metrics configuration
    kubeStateMetrics:
      enabled: true
      
    # Disable components not needed for homelab
    kubeEtcd:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeProxy:
      enabled: false
    
    # Disable default prometheus rules that might be noisy
    defaultRules:
      create: true
      rules:
        # Disable some noisy rules for homelab
        etcd: false
        kubeScheduler: false
        kubeControllerManager: false
        kubeProxy: false
