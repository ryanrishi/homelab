---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 8h
  timeout: 15m
  chart:
    spec:
      chart: longhorn
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
      version: 1.11.2
  values:
    defaultSettings:
      defaultReplicaCount: 2
      createDefaultDiskLabeledNodes: true
      # Data disks are dedicated to Longhorn, not shared with the OS
      storageReservedPercentageForDefaultDisk: 10
    metrics:
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: kube-prometheus-stack
    persistence:
      defaultClass: false
      defaultClassReplicaCount: 2
    ingress:
      enabled: false
    # Longhorn gives each CSI controller a minAvailable=1 PodDisruptionBudget, so a
    # single replica can never be evicted and every node drain deadlocks on it.
    csi:
      attacherReplicaCount: 2
      provisionerReplicaCount: 2
      resizerReplicaCount: 2
      snapshotterReplicaCount: 2
    longhornManager:
      nodeSelector:
        node.longhorn.io/create-default-disk: "true"
    longhornDriver:
      nodeSelector:
        node.longhorn.io/create-default-disk: "true"
