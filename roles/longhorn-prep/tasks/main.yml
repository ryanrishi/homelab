---
- name: Install Longhorn node prerequisites
  ansible.builtin.apt:
    name:
      - open-iscsi
    state: present
    update_cache: true

- name: Enable and start iscsid
  ansible.builtin.systemd:
    name: iscsid
    enabled: true
    state: started

- name: Check for Longhorn data disk
  ansible.builtin.stat:
    path: "{{ longhorn_data_disk }}"
  register: data_disk

- name: Configure Longhorn data disk
  when: data_disk.stat.exists
  vars:
    # ansible_devices is keyed by kernel name, so resolve the symlink to index it.
    data_disk_kernel_name: "{{ data_disk.stat.lnk_source | default(longhorn_data_disk) | basename }}"
    data_disk_bytes: "{{ (ansible_devices[data_disk_kernel_name].sectors | int)
      * (ansible_devices[data_disk_kernel_name].sectorsize | int) }}"
  block:
    - name: Verify the data disk is roughly the expected size
      ansible.builtin.assert:
        that:
          - data_disk_bytes | int > longhorn_data_disk_min_bytes | int
          - data_disk_bytes | int < longhorn_data_disk_max_bytes | int
        fail_msg: >-
          Refusing to format {{ longhorn_data_disk }} ({{ data_disk_kernel_name }},
          {{ data_disk_bytes }} bytes): size outside the expected data disk range

    - name: Detect existing filesystem on data disk
      ansible.builtin.command:
        cmd: blkid {{ longhorn_data_disk }}
      register: blkid_check
      changed_when: false
      failed_when: false

    - name: Format data disk as ext4 with longhorn-data label
      ansible.builtin.command:
        cmd: mkfs.ext4 -L longhorn-data {{ longhorn_data_disk }}
      when: blkid_check.rc != 0

    - name: Create /var/lib/longhorn mount point
      ansible.builtin.file:
        path: /var/lib/longhorn
        state: directory
        mode: "0755"

    - name: Mount data disk at /var/lib/longhorn
      ansible.posix.mount:
        path: /var/lib/longhorn
        src: LABEL=longhorn-data
        fstype: ext4
        opts: defaults
        state: mounted
