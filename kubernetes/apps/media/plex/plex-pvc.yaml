---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-config
  namespace: media
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/config: enabled
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-library
  namespace: media
spec:
  storageClassName: plex-library
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 4Ti
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-versions
  namespace: media
spec:
  storageClassName: plex-versions
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 500Gi
